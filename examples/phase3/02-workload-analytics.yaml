# Phase 3 Example 2: Advanced Workload Analytics
# This example demonstrates Kaiwo's intelligent workload pattern analysis,
# anomaly detection, and performance insights.

apiVersion: kaiwo.silogen.ai/v1alpha1
kind: KaiwoJob
metadata:
  name: analytics-demo-workload
  namespace: default
  annotations:
    # Enable advanced workload analytics
    kaiwo.ai/enable-analytics: "true"
    kaiwo.ai/track-patterns: "true"
    kaiwo.ai/anomaly-detection: "enabled"
    kaiwo.ai/trend-analysis: "enabled"
    # Analytics configuration
    kaiwo.ai/analytics-window: "7d"
    kaiwo.ai/pattern-sensitivity: "medium"
    kaiwo.ai/anomaly-threshold: "2.5"
spec:
  user: "data-scientist@amd.com"
  gpuVendor: "amd"
  gpus: 1.5
  
  # Workload classification for analytics
  workloadClass:
    type: "data_processing"
    category: "batch"
    priority: "medium"
    scalingBehavior: "burst"
  
  # Analytics tracking configuration
  analyticsConfig:
    enablePatternDetection: true
    enableAnomalyDetection: true
    enableTrendAnalysis: true
    enablePerformanceProfiling: true
    metricsCollection:
      interval: "30s"
      detailed: true
      customMetrics:
        - "processing_rate"
        - "memory_efficiency" 
        - "gpu_utilization"
        - "io_throughput"
  
  entryPoint: |
    #!/bin/bash
    echo "📊 Advanced Workload Analytics Demo"
    echo "This workload will demonstrate pattern analysis and anomaly detection"
    
    # Simulate different workload patterns for analytics
    echo "🔍 Phase 1: Normal processing pattern"
    for i in {1..10}; do
      echo "Processing batch $i - CPU: $((50 + RANDOM % 20))% GPU: $((60 + RANDOM % 25))%"
      sleep 15
    done
    
    echo "⚡ Phase 2: Burst pattern (analytics will detect this)"
    for i in {1..5}; do
      echo "BURST: Processing batch $i - CPU: $((80 + RANDOM % 15))% GPU: $((90 + RANDOM % 10))%"
      sleep 8
    done
    
    echo "🐌 Phase 3: Anomaly simulation (intentionally slow)"
    for i in {1..3}; do
      echo "ANOMALY: Slow processing batch $i - CPU: $((20 + RANDOM % 10))% GPU: $((25 + RANDOM % 15))%"
      sleep 45  # Intentionally slow for anomaly detection
    done
    
    echo "🔄 Phase 4: Recovery to normal pattern"
    for i in {1..5}; do
      echo "RECOVERY: Normal batch $i - CPU: $((55 + RANDOM % 20))% GPU: $((65 + RANDOM % 20))%"
      sleep 12
    done
    
    echo "✅ Workload completed - Analytics data collected for pattern analysis"

---
# Workload Analytics Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: workload-analytics-config
  namespace: default
data:
  analytics-rules.yaml: |
    pattern_detection:
      algorithms:
        - name: "k_means_clustering"
          parameters:
            clusters: 5
            features: ["cpu_usage", "gpu_usage", "memory_usage", "io_rate"]
        - name: "time_series_decomposition" 
          parameters:
            seasonality_periods: ["daily", "weekly"]
            trend_detection: true
    
    anomaly_detection:
      algorithms:
        - name: "isolation_forest"
          parameters:
            contamination_rate: 0.05
            features: ["response_time", "resource_efficiency", "error_rate"]
        - name: "statistical_outlier"
          parameters:
            threshold: 2.5
            window_size: 50
    
    trend_analysis:
      metrics:
        - "performance_trend"
        - "resource_utilization_trend"
        - "cost_trend"
        - "efficiency_trend"
      
      forecasting:
        horizon: "30d"
        confidence_level: 0.95
        
  performance-profiling.yaml: |
    profiling:
      bottleneck_detection:
        enabled: true
        thresholds:
          cpu_bottleneck: 0.9
          memory_bottleneck: 0.85
          gpu_bottleneck: 0.95
          io_bottleneck: 0.8
      
      efficiency_analysis:
        resource_efficiency:
          target_cpu: 0.7
          target_memory: 0.8
          target_gpu: 0.85
        cost_efficiency:
          cost_per_job: true
          cost_trends: true
      
      recommendations:
        auto_generate: true
        priority_levels: ["high", "medium", "low"]
        
---
# Analytics Dashboard Configuration
apiVersion: v1
kind: Service
metadata:
  name: analytics-dashboard
  namespace: default
  labels:
    app: kaiwo-analytics
spec:
  selector:
    app: kaiwo-analytics
  ports:
  - name: dashboard
    port: 8080
    targetPort: 8080
  - name: api
    port: 8081
    targetPort: 8081
  type: ClusterIP
